<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        /* OPEN BUTTON */
        .door__open-btn {
            width: 10rem;
            height: 10rem;
            background: radial-gradient(rgba(255, 0, 0, 0.6), black);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99999;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            letter-spacing: 5px;
            font-size: 2rem;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 1px solid red;
            cursor: pointer;
            font-family: 'Gill Sans', Calibri, sans-serif;
        }

        /* DOOR BASE */
        .door {
            position: fixed;
            top: 0;
            width: 50vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* LEFT DOOR */
        .left--door {
            z-index: 9999;
            left: 0;
            justify-content: flex-start;
        }

        /* RIGHT DOOR */
        .right--door {
            z-index: 9999;
            right: 0;
        }

        /* MAKE IMAGE FULL SIZE */
        .door picture,
        .door img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .door img {
            object-fit: cover;
            /* keeps image proportional */
        }

        /* LEFT DOOR — CROP FROM LEFT SIDE */
        .left--door img {
            object-position: right center;
        }

        /* RIGHT DOOR — CROP FROM RIGHT SIDE */
        .right--door img {
            object-position: left center;
        }
    </style>
